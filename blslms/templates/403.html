{% extends 'base.html' %}
{% load static %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-box animate-scale-in">
        <i class="fas fa-lock fa-3x mb-3" style="color: var(--bls-danger);"></i>
        <h1>403</h1>
        <p class="text-muted mt-2">Access Forbidden.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-bls mt-3">
            <i class="fas fa-home me-1"></i>Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
