{% extends 'base.html' %}
{% load static %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-box animate-scale-in">
        <i class="fas fa-server fa-3x mb-3" style="color: var(--bls-danger);"></i>
        <h1>500</h1>
        <p class="text-muted mt-2">Server Error. BLS apologises for any inconvenience.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-bls mt-3">
            <i class="fas fa-home me-1"></i>Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
