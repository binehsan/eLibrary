{% extends 'base.html' %}
{% load static %}

{% block title %}Error - eLibrary{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-box animate-scale-in">
        <i class="fas fa-exclamation-circle fa-3x mb-3" style="color: var(--bls-danger);"></i>
        <h1>{{ message }}</h1>
        <a href="{% url 'student_dashboard' %}" class="btn btn-bls mt-3">
            <i class="fas fa-home me-1"></i>Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
