{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Review - BLS eLibrary{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-box animate-scale-in">
        <i class="fas fa-check-circle fa-3x mb-3" style="color: var(--bls-success);"></i>
        <h2 class="fw-bold" style="color: var(--bls-success);">Review Deleted</h2>
        <p class="text-muted mt-2">Your review has been deleted.</p>
        <a href="javascript:window.close();" class="btn btn-bls mt-3">
            <i class="fas fa-times me-1"></i>Close
        </a>
    </div>
</div>
{% endblock %}
