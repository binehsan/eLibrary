{% extends 'base.html' %}
{% load static %}

{% block title %}Damage Execution - eLibrary{% endblock %}

{% block extra_css %}
<style>
    /* Center the main content */
    .content-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 50px;
    }

    /* Loan status message styling */
    .status-message {
        font-weight: bold;
        font-size: 24px;
        color: {% if success %}green{% else %}red{% endif %};
        text-align: center;
        
    }

    /* Reason box styling */
    .reason-box {
        background-color: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin: 20px auto;
        width: 60%;
        text-align: center;
        font-size: 16px;
        color: #333;
    }

    /* Buttons styling */
    .action-btn {
        display: inline-block;
        margin-top: 15px;
        background-color: #0066cc;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 16px;
        transition: background 0.3s;
    }

    .action-btn:hover {
        background-color: #004d99;
    }
    .icon {
        width: 100px;
        margin-bottom: 10px;
    }
</style>
{% endblock %}

{% block content %}
<div class="content-container">    
    <div class="reason-box">
        <img src="{% static 'successful.png' %}" alt="NotSuccessful" class="icon">
        
        <div class="status-message">
            Thank You. Your report has been logged.
        </div>
            
      
        <a href="{% url 'student_dashboard' %}" class="action-btn">Go to Dashboard</a>
        
    </div>

</div>
{% endblock %}
