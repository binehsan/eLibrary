<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BLS eLibrary{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'css/bls.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg bls-navbar">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'student_dashboard' %}">
                <img src="{% static 'logos/favicon.png' %}" alt="BLS Logo">
                <span>BLS eLibrary</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                <a href="{% url 'profile' user.username %}" class="d-flex align-items-center text-decoration-none">
                    <img src="{% static 'student-icon.png' %}" alt="User" class="bls-user-avatar">
                </a>
                <span class="d-none d-md-inline fw-semibold text-muted small">{{ user.username }}</span>
                <a href="{% url 'account_logout' %}" class="btn btn-bls btn-sm ms-1">
                    <i class="fas fa-sign-out-alt me-1"></i>Logout
                </a>
                {% else %}
                <a href="{% url 'account_login' %}" class="btn btn-bls btn-sm">
                    <i class="fas fa-sign-in-alt me-1"></i>Login
                </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container-fluid px-3 px-lg-4 py-3">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Replace broken cover images with a book icon fallback
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('img[data-cover]').forEach(function(img) {
            img.onerror = function() {
                var div = document.createElement('div');
                div.innerHTML = '<i class="fas fa-book"></i>';
                div.className = img.dataset.fallback || 'cover-fallback';
                if (img.dataset.fallbackStyle) div.style.cssText = img.dataset.fallbackStyle;
                img.parentNode.replaceChild(div, img);
            };
            // Trigger check for already-failed images
            if (img.complete && img.naturalWidth === 0) img.onerror();
        });
    });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
