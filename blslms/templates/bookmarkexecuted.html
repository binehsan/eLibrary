{% extends 'base.html' %}
{% load static %}

{% block title %}Bookmark Executed - eLibrary{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-box animate-scale-in">
        {% if success %}
        <i class="fas fa-check-circle fa-3x mb-3" style="color: var(--bls-success);"></i>
        <h2 class="fw-bold" style="color: var(--bls-success);">Bookmark Saved!</h2>
        {% else %}
        <i class="fas fa-times-circle fa-3x mb-3" style="color: var(--bls-danger);"></i>
        <h2 class="fw-bold" style="color: var(--bls-danger);">Bookmark Not Posted</h2>
        <p class="text-muted">{{ reason }}</p>
        {% endif %}
        <a href="javascript:window.close();" class="btn btn-bls mt-3">
            <i class="fas fa-times me-1"></i>Close
        </a>
    </div>
</div>
{% endblock %}
