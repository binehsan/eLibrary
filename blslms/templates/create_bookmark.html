{% extends "basebck.html" %}
{% load static %}

{% block title %}Create Bookmark - BLS eLibrary{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-up">
    <div class="col-11">
        <div class="bls-card-static p-4 text-center">
            <h4 class="bls-heading bls-heading-center mb-3">
                <i class="fas fa-bookmark me-2"></i>Create Bookmark
            </h4>

            <h5 class="fw-bold mt-3" style="color: var(--bls-navy);">{{ book.title }}</h5>
            <p class="text-muted">{{ book.author }}</p>

            <form method="post" action="{% url 'bookmark_executed' book.book_id %}" class="bls-form mt-3">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-bls-success">
                        <i class="fas fa-save me-1"></i>Save Bookmark
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
