{% extends 'base.html' %}
{% load static %}

{% block title %}Review Executed - eLibrary{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-box animate-scale-in">
        {% if success %}
        <i class="fas fa-check-circle fa-3x mb-3" style="color: var(--bls-success);"></i>
        <h2 class="fw-bold" style="color: var(--bls-success);">Review Posted!</h2>
        <a href="{% url 'book' book.book_id %}" class="btn btn-bls mt-3">
            <i class="fas fa-book me-1"></i>Back to Book
        </a>
        {% else %}
        <i class="fas fa-times-circle fa-3x mb-3" style="color: var(--bls-danger);"></i>
        <h2 class="fw-bold" style="color: var(--bls-danger);">Review Not Posted</h2>
        <p class="text-muted"><em>Reason: {{ reason }}</em></p>
        <a href="{% url 'review' book.book_id %}" class="btn btn-bls mt-3">
            <i class="fas fa-redo me-1"></i>Try Again
        </a>
        {% endif %}
    </div>
</div>
{% endblock %}
