{% extends 'base.html' %}
{% load static %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-box animate-scale-in">
        <i class="fas fa-search fa-3x mb-3" style="color: var(--bls-danger);"></i>
        <h1>404</h1>
        <p class="text-muted mt-2">Sorry, this page cannot be found.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-bls mt-3">
            <i class="fas fa-home me-1"></i>Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
